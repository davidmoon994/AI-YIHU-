# ============================================================
#  AI-YIHU 社区就医陪诊服务 - Docker Compose
#  用法：docker compose up -d --build
# ============================================================

services:
  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: yihu-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 后台管理静态页面（直接挂载，更新无需重建镜像）
      - ./admin（后台）/index.html:/admin_static/index.html:ro
      # 上传文件持久化
      - yihu-uploads:/uploads
    depends_on:
      app:
        condition: service_healthy
    networks:
      - yihu-net

  # ---------- Node.js 后端 ----------
  app:
    build: .
    container_name: yihu-app
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    volumes:
      - yihu-uploads:/app/uploads
      - yihu-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yihu-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------- MySQL 8.0 ----------
  mysql:
    image: mysql:8.0
    container_name: yihu-mysql
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    volumes:
      - yihu-mysql-data:/var/lib/mysql
    networks:
      - yihu-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$MYSQL_USER", "-p$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

volumes:
  yihu-mysql-data:
  yihu-uploads:
  yihu-logs:

networks:
  yihu-net:
    name: yihu-net

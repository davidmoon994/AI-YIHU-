<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI陪诊 - 后台管理系统</title>
  <!-- Vue 2 + Element UI + axios + echarts (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/vue-router@3.6.5/dist/vue-router.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/axios@1.7.7/dist/axios.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #app { display: flex; height: 100vh; }
    .sidebar { width: 220px; background: #304156; color: #bfcbd9; flex-shrink: 0; }
    .sidebar-title { color: #fff; font-size: 18px; font-weight: bold; padding: 20px; text-align: center; border-bottom: 1px solid #3a4a5e; }
    .sidebar .el-menu { border-right: none; }
    .sidebar .el-menu-item { color: #bfcbd9; }
    .sidebar .el-menu-item:hover, .sidebar .el-menu-item.is-active { color: #409eff; background: #263445; }
    .main { flex: 1; overflow-y: auto; background: #f0f2f5; }
    .main-header { background: #fff; padding: 16px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; }
    .main-header h3 { margin: 0; font-size: 16px; color: #333; }
    .main-body { padding: 20px; }
    .stat-card { text-align: center; padding: 10px 0; }
    .stat-label { font-size: 14px; color: #909399; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: bold; color: #303133; }
    .stat-value.income { color: #ff4d4f; }
    .login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-card { background: #fff; padding: 40px; border-radius: 12px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card h2 { text-align: center; margin-bottom: 30px; color: #333; }
  </style>
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <div v-if="!isLoggedIn" class="login-page">
    <div class="login-card">
      <h2>AI陪诊 后台管理</h2>
      <el-form :model="loginForm" label-width="0">
        <el-form-item>
          <el-input v-model="loginForm.username" placeholder="管理员账号" prefix-icon="el-icon-user" @keyup.enter.native="handleLogin" />
        </el-form-item>
        <el-form-item>
          <el-input v-model="loginForm.password" placeholder="密码" prefix-icon="el-icon-lock" show-password @keyup.enter.native="handleLogin" />
        </el-form-item>
        <el-form-item>
          <el-button type="primary" style="width: 100%;" :loading="loginLoading" @click="handleLogin">登 录</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>

  <!-- 主界面 -->
  <template v-else>
    <div class="sidebar">
      <div class="sidebar-title">AI陪诊管理后台</div>
      <el-menu :default-active="$route.path" router background-color="#304156" text-color="#bfcbd9" active-text-color="#409eff">
        <el-menu-item index="/dashboard"><i class="el-icon-s-data"></i><span>运营总览</span></el-menu-item>
        <el-menu-item index="/orders"><i class="el-icon-s-order"></i><span>订单管理</span></el-menu-item>
        <el-menu-item index="/escorts"><i class="el-icon-user"></i><span>陪诊员管理</span></el-menu-item>
        <el-menu-item index="/community"><i class="el-icon-s-home"></i><span>社区与系统</span></el-menu-item>
        <el-menu-item index="/payment"><i class="el-icon-wallet"></i><span>支付管理</span></el-menu-item>
      </el-menu>
    </div>
    <div class="main">
      <div class="main-header">
        <h3>{{ pageTitle }}</h3>
        <el-button type="text" @click="handleLogout"><i class="el-icon-switch-button"></i> 退出登录</el-button>
      </div>
      <div class="main-body">
        <router-view></router-view>
      </div>
    </div>
  </template>
</div>

<script>
// ==================== axios 拦截器 ====================
const API_BASE = '/api/v1/admin'
axios.interceptors.request.use(config => {
  const token = localStorage.getItem('admin_token')
  if (token) config.headers.Authorization = `Bearer ${token}`
  return config
})
axios.interceptors.response.use(res => res, err => {
  if (err.response && err.response.status === 401) {
    localStorage.removeItem('admin_token')
    location.reload()
  }
  return Promise.reject(err)
})

// ==================== 组件：Dashboard ====================
const DashboardPage = {
  template: `
    <div class="dashboard">
      <el-row :gutter="20" style="margin-bottom:20px">
        <el-col :span="6"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">今日订单</div><div class="stat-value">{{dash.todayOrders||0}}</div></div></el-card></el-col>
        <el-col :span="6"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">今日收入</div><div class="stat-value income">¥{{dash.todayIncome||0}}</div></div></el-card></el-col>
        <el-col :span="6"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">在线陪诊员</div><div class="stat-value">{{dash.onlineEscorts||0}}</div></div></el-card></el-col>
        <el-col :span="6"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">本月订单</div><div class="stat-value">{{dash.monthOrders||0}}</div></div></el-card></el-col>
      </el-row>
      <el-row :gutter="20" style="margin-bottom:20px">
        <el-col :span="8"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">累计总收入</div><div class="stat-value income">¥{{stats.totalIncome||0}}</div></div></el-card></el-col>
        <el-col :span="8"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">累计总订单</div><div class="stat-value">{{stats.totalOrders||0}}</div></div></el-card></el-col>
        <el-col :span="8"><el-card shadow="hover"><div class="stat-card"><div class="stat-label">陪诊员平均评分</div><div class="stat-value">{{escortStats.avgRating?Number(escortStats.avgRating).toFixed(2):'-'}}</div></div></el-card></el-col>
      </el-row>
      <el-row :gutter="20">
        <el-col :span="14"><el-card><div slot="header"><b>订单趋势（近7日）</b></div><div ref="orderChart" style="height:320px"></div></el-card></el-col>
        <el-col :span="10"><el-card><div slot="header"><b>订单状态分布</b></div><div ref="statusChart" style="height:320px"></div></el-card></el-col>
      </el-row>
    </div>`,
  data() {
    return { dash: {}, stats: {}, escortStats: {}, orderChart: null, statusChart: null }
  },
  async mounted() {
    await Promise.all([this.loadDash(), this.loadStats(), this.loadEscortStats()])
    this.initCharts()
    window.addEventListener('resize', this.handleResize)
  },
  beforeDestroy() {
    window.removeEventListener('resize', this.handleResize)
    if (this.orderChart) this.orderChart.dispose()
    if (this.statusChart) this.statusChart.dispose()
  },
  methods: {
    async loadDash() { try { const r = await axios.get(`${API_BASE}/dashboard`); this.dash = r.data.data || {} } catch(e){} },
    async loadStats() { try { const r = await axios.get(`${API_BASE}/statistics/payment`); this.stats = r.data.data || {} } catch(e){} },
    async loadEscortStats() { try { const r = await axios.get(`${API_BASE}/statistics/escort`); this.escortStats = r.data.data || {} } catch(e){} },
    initCharts() {
      if (this.$refs.orderChart) {
        this.orderChart = echarts.init(this.$refs.orderChart)
        const days = []; for (let i=6;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); days.push(`${d.getMonth()+1}/${d.getDate()}`) }
        this.orderChart.setOption({
          tooltip:{trigger:'axis'}, xAxis:{type:'category',data:days}, yAxis:{type:'value',name:'订单数'},
          series:[{name:'订单数',type:'line',smooth:true,data:days.map(()=>Math.floor(Math.random()*20+5)),areaStyle:{opacity:.15},itemStyle:{color:'#1677ff'}}],
          grid:{left:50,right:20,bottom:30,top:30}
        })
      }
      if (this.$refs.statusChart) {
        this.statusChart = echarts.init(this.$refs.statusChart)
        this.statusChart.setOption({
          tooltip:{trigger:'item'}, legend:{bottom:0},
          series:[{type:'pie',radius:['40%','65%'],label:{show:true,formatter:'{b}: {c}'},data:[
            {value:12,name:'待支付'},{value:8,name:'派单中'},{value:15,name:'已指派'},{value:5,name:'服务中'},{value:60,name:'已完成'},{value:3,name:'已取消'}
          ]}]
        })
      }
    },
    handleResize() { if(this.orderChart) this.orderChart.resize(); if(this.statusChart) this.statusChart.resize() }
  }
}

// ==================== 组件：订单管理 ====================
const STATUS_MAP = {pending:'待支付',paid:'已支付',dispatching:'派单中',assigned:'已指派',accepted:'已接单',arrived:'已到达',serving:'服务中',completed:'已完成',cancelled:'已取消',refund:'退款中',closed:'已关闭'}
const SERVICE_TYPE_MAP = {escort:'陪诊',register:'代挂号',pickup:'接送',planning:'AI规划'}

const OrdersPage = {
  template: `
    <div>
      <el-row :gutter="16" style="margin-bottom:16px">
        <el-col :span="5"><el-input v-model="searchOrderNo" placeholder="搜索订单号" clearable @clear="loadList" @keyup.enter.native="loadList"><el-button slot="append" icon="el-icon-search" @click="loadList"></el-button></el-input></el-col>
        <el-col :span="4"><el-select v-model="filterStatus" placeholder="订单状态" clearable @change="loadList"><el-option v-for="s in statusOptions" :key="s.value" :label="s.label" :value="s.value"/></el-select></el-col>
        <el-col :span="4"><el-button type="primary" @click="loadList">刷新</el-button></el-col>
      </el-row>
      <el-table :data="filteredList" border stripe v-loading="loading" style="width:100%">
        <el-table-column prop="id" label="ID" width="60"/>
        <el-table-column prop="order_no" label="订单号" width="150"/>
        <el-table-column label="服务类型" width="90"><template slot-scope="{row}">{{serviceTypeMap[row.service_type]||row.service_type}}</template></el-table-column>
        <el-table-column prop="hospital_name" label="医院" width="130" show-overflow-tooltip/>
        <el-table-column prop="patient_name" label="就诊人" width="80"/>
        <el-table-column label="金额" width="90"><template slot-scope="{row}">¥{{row.payable_amount}}</template></el-table-column>
        <el-table-column label="支付状态" width="90"><template slot-scope="{row}"><el-tag :type="payType(row.payment_status)" size="small">{{row.payment_status}}</el-tag></template></el-table-column>
        <el-table-column label="订单状态" width="100"><template slot-scope="{row}"><el-tag :type="orderType(row.order_status)" size="small">{{statusLabel(row.order_status)}}</el-tag></template></el-table-column>
        <el-table-column prop="escort_id" label="陪诊员" width="80"><template slot-scope="{row}">{{row.escort_id||'-'}}</template></el-table-column>
        <el-table-column label="操作" min-width="260" fixed="right">
          <template slot-scope="{row}">
            <el-button size="mini" @click="viewDetail(row)">详情</el-button>
            <el-button size="mini" type="warning" v-if="['dispatching','assigned'].includes(row.order_status)" @click="showDispatch(row)">人工派单</el-button>
            <el-button size="mini" type="danger" v-if="['pending','dispatching','assigned'].includes(row.order_status)" @click="cancelOrder(row)">取消</el-button>
            <el-button size="mini" type="info" v-if="row.payment_status==='SUCCESS'&&row.order_status!=='completed'" @click="refundOrder(row)">退款</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination style="margin-top:16px;text-align:right" background layout="total, sizes, prev, pager, next" :total="total" :page-sizes="[10,20,50]" :page-size.sync="pageSize" :current-page.sync="page" @current-change="loadList" @size-change="page=1;loadList()"/>
      <el-dialog title="订单详情" :visible.sync="showDetail" width="600px">
        <el-descriptions :column="2" border v-if="detailData">
          <el-descriptions-item label="订单号">{{detailData.order_no}}</el-descriptions-item>
          <el-descriptions-item label="状态">{{statusLabel(detailData.order_status)}}</el-descriptions-item>
          <el-descriptions-item label="服务类型">{{serviceTypeMap[detailData.service_type]}}</el-descriptions-item>
          <el-descriptions-item label="金额">¥{{detailData.payable_amount}}</el-descriptions-item>
          <el-descriptions-item label="医院">{{detailData.hospital_name||'-'}}</el-descriptions-item>
          <el-descriptions-item label="就诊人">{{detailData.patient_name||'-'}}</el-descriptions-item>
          <el-descriptions-item label="预约时间">{{detailData.appointment_time||'-'}}</el-descriptions-item>
          <el-descriptions-item label="创建时间">{{detailData.created_at||'-'}}</el-descriptions-item>
        </el-descriptions>
      </el-dialog>
      <el-dialog title="人工派单" :visible.sync="showDispatchDialog" width="400px">
        <p>订单：{{dispatchTarget&&dispatchTarget.order_no}}</p>
        <el-input v-model="dispatchEscortId" placeholder="输入陪诊员ID"/>
        <span slot="footer"><el-button @click="showDispatchDialog=false">取消</el-button><el-button type="primary" :loading="dispatching" @click="doDispatch">确认派单</el-button></span>
      </el-dialog>
    </div>`,
  data() {
    return {
      list:[],total:0,page:1,pageSize:20,loading:false,searchOrderNo:'',filterStatus:'',
      statusOptions:Object.entries(STATUS_MAP).map(([v,l])=>({value:v,label:l})),
      serviceTypeMap:SERVICE_TYPE_MAP,
      showDetail:false,detailData:null,showDispatchDialog:false,dispatchTarget:null,dispatchEscortId:null,dispatching:false
    }
  },
  computed: {
    filteredList() { if(!this.searchOrderNo) return this.list; return this.list.filter(o=>o.order_no.includes(this.searchOrderNo)) }
  },
  mounted() { this.loadList() },
  methods: {
    async loadList() {
      this.loading=true
      try { const r=await axios.get(`${API_BASE}/orders`,{params:{page:this.page,pageSize:this.pageSize,status:this.filterStatus||undefined}}); const d=r.data.data; this.list=d.list||[]; this.total=d.total||0 } catch(e){this.$message.error('加载失败')} finally{this.loading=false}
    },
    async viewDetail(row) { try{const r=await axios.get(`${API_BASE}/orders/detail`,{params:{orderId:row.id}});this.detailData=r.data.data;this.showDetail=true}catch(e){this.$message.error('获取详情失败')} },
    showDispatch(row) { this.dispatchTarget=row;this.dispatchEscortId=null;this.showDispatchDialog=true },
    async doDispatch() {
      if(!this.dispatchEscortId) return this.$message.warning('请输入陪诊员ID')
      this.dispatching=true
      try{await axios.post(`${API_BASE}/orders/manual-dispatch`,{orderId:this.dispatchTarget.id,escortId:this.dispatchEscortId});this.$message.success('派单成功');this.showDispatchDialog=false;this.loadList()}catch(e){this.$message.error('派单失败')}finally{this.dispatching=false}
    },
    async cancelOrder(row) { try{await this.$confirm('确定取消？','警告',{type:'warning'});await axios.post(`${API_BASE}/orders/cancel`,{orderId:row.id});this.$message.success('已取消');this.loadList()}catch(e){if(e!=='cancel')this.$message.error('失败')} },
    async refundOrder(row) { try{const{value}=await this.$prompt('退款原因','退款',{inputValue:'后台发起退款'});await axios.post(`${API_BASE}/orders/refund`,{orderId:row.id,reason:value});this.$message.success('退款已提交');this.loadList()}catch(e){if(e!=='cancel')this.$message.error('失败')} },
    statusLabel(s){return STATUS_MAP[s]||s},
    orderType(s){return{completed:'success',cancelled:'info',dispatching:'warning'}[s]||''},
    payType(s){return{SUCCESS:'success',PAYING:'warning',FAILED:'danger',REFUNDED:'info'}[s]||'info'}
  }
}

// ==================== 组件：陪诊员管理 ====================
const EscortsPage = {
  template: `
    <div>
      <el-row :gutter="16" style="margin-bottom:16px">
        <el-col :span="6"><el-input v-model="searchPhone" placeholder="搜索手机号" clearable @clear="loadList" @keyup.enter.native="loadList"><el-button slot="append" icon="el-icon-search" @click="loadList"></el-button></el-input></el-col>
        <el-col :span="14" style="text-align:right"><el-button type="primary" icon="el-icon-plus" @click="showCreate=true">新增陪诊员</el-button></el-col>
      </el-row>
      <el-table :data="list" border stripe v-loading="loading" style="width:100%">
        <el-table-column prop="id" label="ID" width="60"/>
        <el-table-column prop="name" label="姓名" width="100"/>
        <el-table-column prop="phone" label="手机号" width="130"/>
        <el-table-column label="状态" width="100"><template slot-scope="{row}"><el-tag :type="row.status==='online'?'success':'info'" size="small">{{row.status}}</el-tag></template></el-table-column>
        <el-table-column prop="rating" label="评分" width="80"/>
        <el-table-column prop="total_orders" label="总单" width="80"/>
        <el-table-column prop="completed_orders" label="完成" width="80"/>
        <el-table-column label="创建时间" width="160"><template slot-scope="{row}">{{row.created_at}}</template></el-table-column>
        <el-table-column label="操作" min-width="200" fixed="right">
          <template slot-scope="{row}">
            <el-button size="mini" @click="viewDetail(row)">详情</el-button>
            <el-button size="mini" type="success" @click="approve(row)">启用</el-button>
            <el-button size="mini" type="danger" @click="disable(row)">禁用</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination style="margin-top:16px;text-align:right" background layout="total, prev, pager, next" :total="total" :page-size="pageSize" :current-page.sync="page" @current-change="loadList"/>
      <el-dialog title="新增陪诊员" :visible.sync="showCreate" width="500px">
        <el-form :model="form" label-width="80px">
          <el-form-item label="姓名"><el-input v-model="form.name"/></el-form-item>
          <el-form-item label="手机号"><el-input v-model="form.phone"/></el-form-item>
          <el-form-item label="社区ID"><el-input-number v-model="form.communityId" :min="1"/></el-form-item>
          <el-form-item label="密码"><el-input v-model="form.password" placeholder="默认123456"/></el-form-item>
        </el-form>
        <span slot="footer"><el-button @click="showCreate=false">取消</el-button><el-button type="primary" :loading="submitting" @click="create">确定</el-button></span>
      </el-dialog>
      <el-dialog title="陪诊员详情" :visible.sync="showDetail" width="500px">
        <el-descriptions :column="1" border v-if="detailData">
          <el-descriptions-item label="ID">{{detailData.id}}</el-descriptions-item>
          <el-descriptions-item label="姓名">{{detailData.name}}</el-descriptions-item>
          <el-descriptions-item label="手机号">{{detailData.phone}}</el-descriptions-item>
          <el-descriptions-item label="评分">{{detailData.rating||'-'}}</el-descriptions-item>
          <el-descriptions-item label="总单数">{{detailData.total_orders||0}}</el-descriptions-item>
          <el-descriptions-item label="完成单数">{{detailData.completed_orders||0}}</el-descriptions-item>
          <el-descriptions-item label="状态">{{detailData.status}}</el-descriptions-item>
        </el-descriptions>
      </el-dialog>
    </div>`,
  data() { return { list:[],total:0,page:1,pageSize:20,loading:false,searchPhone:'',showCreate:false,submitting:false,form:{name:'',phone:'',communityId:1,password:'123456'},showDetail:false,detailData:null } },
  mounted() { this.loadList() },
  methods: {
    async loadList() { this.loading=true; try{const r=await axios.get(`${API_BASE}/escorts`,{params:{page:this.page,pageSize:this.pageSize}});const d=r.data.data;this.list=d.list||[];this.total=d.total||0}catch(e){this.$message.error('加载失败')}finally{this.loading=false} },
    async viewDetail(row) { try{const r=await axios.get(`${API_BASE}/escorts/detail`,{params:{escortId:row.id}});this.detailData=r.data.data;this.showDetail=true}catch(e){this.$message.error('失败')} },
    async approve(row) { try{await this.$confirm('确定启用？','提示',{type:'success'});await axios.post(`${API_BASE}/escorts/approve`,{escortId:row.id});this.$message.success('已启用');this.loadList()}catch(e){if(e!=='cancel')this.$message.error('失败')} },
    async disable(row) { try{await this.$confirm('确定禁用？','警告',{type:'warning'});await axios.post(`${API_BASE}/escorts/disable`,{escortId:row.id});this.$message.success('已禁用');this.loadList()}catch(e){if(e!=='cancel')this.$message.error('失败')} },
    async create() {
      if(!this.form.name||!this.form.phone) return this.$message.warning('姓名和手机号必填')
      this.submitting=true; try{await axios.post(`${API_BASE}/escorts/create`,this.form);this.$message.success('创建成功');this.showCreate=false;this.loadList()}catch(e){this.$message.error('失败')}finally{this.submitting=false}
    }
  }
}

// ==================== 组件：社区与系统管理 ====================
const CommunityPage = {
  template: `
    <div>
      <el-tabs v-model="activeTab">
        <el-tab-pane label="社区管理" name="community">
          <el-row style="margin-bottom:16px"><el-button type="primary" icon="el-icon-plus" @click="openCreate">新增社区</el-button></el-row>
          <el-table :data="communityList" border stripe v-loading="communityLoading">
            <el-table-column prop="id" label="ID" width="60"/>
            <el-table-column prop="name" label="名称" width="140"/>
            <el-table-column prop="code" label="编码" width="140"/>
            <el-table-column prop="manager_name" label="负责人" width="100"/>
            <el-table-column prop="manager_phone" label="电话" width="130"/>
            <el-table-column label="地址" min-width="200" show-overflow-tooltip><template slot-scope="{row}">{{[row.province,row.city,row.district,row.address].filter(Boolean).join('')||'-'}}</template></el-table-column>
            <el-table-column label="状态" width="80"><template slot-scope="{row}"><el-tag :type="row.status===1?'success':'danger'" size="small">{{row.status===1?'启用':'禁用'}}</el-tag></template></el-table-column>
            <el-table-column label="操作" width="100"><template slot-scope="{row}"><el-button size="mini" @click="openEdit(row)">编辑</el-button></template></el-table-column>
          </el-table>
        </el-tab-pane>
        <el-tab-pane label="系统配置" name="config">
          <el-table :data="configList" border stripe v-loading="configLoading">
            <el-table-column prop="config_key" label="配置键" width="260"/>
            <el-table-column label="配置值" min-width="200"><template slot-scope="{row}"><el-input v-if="editKey===row.config_key" v-model="editVal" size="small" style="width:200px"/><span v-else>{{row.config_value}}</span></template></el-table-column>
            <el-table-column prop="description" label="说明" min-width="200" show-overflow-tooltip/>
            <el-table-column label="操作" width="160">
              <template slot-scope="{row}">
                <template v-if="editKey===row.config_key"><el-button size="mini" type="success" @click="saveConfig(row)">保存</el-button><el-button size="mini" @click="editKey=null">取消</el-button></template>
                <el-button v-else size="mini" @click="editKey=row.config_key;editVal=row.config_value">编辑</el-button>
              </template>
            </el-table-column>
          </el-table>
        </el-tab-pane>
      </el-tabs>
      <el-dialog :title="cForm.id?'编辑社区':'新增社区'" :visible.sync="showDialog" width="550px">
        <el-form :model="cForm" label-width="80px">
          <el-form-item label="名称"><el-input v-model="cForm.name"/></el-form-item>
          <el-form-item label="编码"><el-input v-model="cForm.code"/></el-form-item>
          <el-form-item label="负责人"><el-input v-model="cForm.managerName"/></el-form-item>
          <el-form-item label="电话"><el-input v-model="cForm.managerPhone"/></el-form-item>
          <el-form-item label="省份"><el-input v-model="cForm.province"/></el-form-item>
          <el-form-item label="城市"><el-input v-model="cForm.city"/></el-form-item>
          <el-form-item label="区县"><el-input v-model="cForm.district"/></el-form-item>
          <el-form-item label="地址"><el-input v-model="cForm.address"/></el-form-item>
        </el-form>
        <span slot="footer"><el-button @click="showDialog=false">取消</el-button><el-button type="primary" :loading="cSubmitting" @click="submitCommunity">确定</el-button></span>
      </el-dialog>
    </div>`,
  data() { return { activeTab:'community',communityList:[],communityLoading:false,configList:[],configLoading:false,showDialog:false,cSubmitting:false,cForm:{id:null,name:'',code:'',managerName:'',managerPhone:'',province:'',city:'',district:'',address:'',status:1},editKey:null,editVal:'' } },
  watch: { activeTab(v) { if(v==='community'&&this.communityList.length===0) this.loadCommunities(); if(v==='config'&&this.configList.length===0) this.loadConfigs() } },
  mounted() { this.loadCommunities() },
  methods: {
    async loadCommunities() { this.communityLoading=true;try{const r=await axios.get(`${API_BASE}/communities`);this.communityList=r.data.data||[]}catch(e){this.$message.error('加载失败')}finally{this.communityLoading=false} },
    openCreate() { this.cForm={id:null,name:'',code:'',managerName:'',managerPhone:'',province:'',city:'',district:'',address:'',status:1};this.showDialog=true },
    openEdit(row) { this.cForm={id:row.id,name:row.name,code:row.code,managerName:row.manager_name,managerPhone:row.manager_phone,province:row.province,city:row.city,district:row.district,address:row.address,status:row.status};this.showDialog=true },
    async submitCommunity() {
      if(!this.cForm.name||!this.cForm.code) return this.$message.warning('名称和编码必填')
      this.cSubmitting=true;try{if(this.cForm.id){await axios.put(`${API_BASE}/communities/update`,this.cForm);this.$message.success('更新成功')}else{await axios.post(`${API_BASE}/communities/create`,this.cForm);this.$message.success('创建成功')}this.showDialog=false;this.loadCommunities()}catch(e){this.$message.error('失败')}finally{this.cSubmitting=false}
    },
    async loadConfigs() { this.configLoading=true;try{const r=await axios.get(`${API_BASE}/configs`);this.configList=r.data.data||[]}catch(e){this.$message.error('加载失败')}finally{this.configLoading=false} },
    async saveConfig(row) { try{await axios.put(`${API_BASE}/configs/update`,{configKey:row.config_key,configValue:this.editVal});this.$message.success('已保存');this.editKey=null;this.loadConfigs()}catch(e){this.$message.error('保存失败')} }
  }
}

// ==================== 组件：支付管理 ====================
const PaymentPage = {
  template: `
    <div>
      <el-card style="margin-bottom:20px">
        <div slot="header"><b>支付配置</b></div>
        <el-form label-width="160px" v-loading="configLoading">
          <el-form-item label="支付模式">
            <el-radio-group v-model="payConfig.pay_mode" @change="saveConfig('pay_mode', $event)">
              <el-radio label="direct">直连商户</el-radio>
              <el-radio label="partner">服务商模式</el-radio>
            </el-radio-group>
          </el-form-item>
          <el-form-item label="服务商商户号(sp_mchid)">
            <el-input v-model="payConfig.sp_mchid" placeholder="服务商模式时必填" style="width:320px" @blur="saveConfig('sp_mchid', payConfig.sp_mchid)"></el-input>
          </el-form-item>
          <el-form-item label="APIv3密钥">
            <el-input v-model="payConfig.api_v3_key" placeholder="微信支付APIv3密钥" style="width:320px" show-password @blur="saveConfig('api_v3_key', payConfig.api_v3_key)"></el-input>
          </el-form-item>
          <el-form-item label="证书序列号">
            <el-input v-model="payConfig.serial_no" placeholder="商户证书序列号" style="width:320px" @blur="saveConfig('serial_no', payConfig.serial_no)"></el-input>
          </el-form-item>
          <el-form-item label="私钥文件路径">
            <el-input v-model="payConfig.private_key_path" placeholder="服务器上的私钥文件路径" style="width:320px" @blur="saveConfig('private_key_path', payConfig.private_key_path)"></el-input>
          </el-form-item>
          <el-form-item label="分账功能">
            <el-switch v-model="payConfig.profit_share_enabled" active-value="1" inactive-value="0" @change="saveConfig('profit_share_enabled', payConfig.profit_share_enabled)"></el-switch>
            <span style="margin-left:12px;color:#909399;font-size:12px">开启后订单完成时自动分账抽佣</span>
          </el-form-item>
        </el-form>
      </el-card>
      <el-card>
        <div slot="header"><b>社区子商户管理</b></div>
        <el-table :data="communities" v-loading="tableLoading" border stripe>
          <el-table-column prop="id" label="ID" width="60" />
          <el-table-column prop="name" label="社区名称" />
          <el-table-column prop="manager_name" label="负责人" />
          <el-table-column prop="manager_phone" label="联系电话" />
          <el-table-column label="子商户号" width="200">
            <template slot-scope="scope">
              <el-input v-if="editingId===scope.row.id" v-model="editForm.subMchid" size="mini" placeholder="子商户号"></el-input>
              <span v-else>{{scope.row.sub_mchid||'未配置'}}</span>
            </template>
          </el-table-column>
          <el-table-column label="抽佣比例(%)" width="150">
            <template slot-scope="scope">
              <el-input-number v-if="editingId===scope.row.id" v-model="editForm.commissionRate" :min="0" :max="100" :precision="2" size="mini"></el-input-number>
              <span v-else>{{scope.row.commission_rate||0}}%</span>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="180">
            <template slot-scope="scope">
              <template v-if="editingId===scope.row.id">
                <el-button type="primary" size="mini" @click="saveCommunity(scope.row)">保存</el-button>
                <el-button size="mini" @click="editingId=null">取消</el-button>
              </template>
              <el-button v-else type="text" @click="startEdit(scope.row)">编辑</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-card>
    </div>`,
  data() {
    return {
      configLoading: false,
      tableLoading: false,
      payConfig: { pay_mode: 'direct', sp_mchid: '', api_v3_key: '', serial_no: '', private_key_path: '', profit_share_enabled: '0' },
      communities: [],
      editingId: null,
      editForm: { subMchid: '', commissionRate: 0 }
    }
  },
  async mounted() {
    await Promise.all([this.loadConfig(), this.loadCommunities()])
  },
  methods: {
    async loadConfig() {
      this.configLoading = true
      try {
        const r = await axios.get(API_BASE + '/payment/config')
        const data = r.data.data || {}
        for (const key of Object.keys(this.payConfig)) {
          if (data[key]) this.payConfig[key] = data[key].value || this.payConfig[key]
        }
      } catch (e) { this.$message.error('加载支付配置失败') }
      finally { this.configLoading = false }
    },
    async saveConfig(key, value) {
      try {
        await axios.put(API_BASE + '/payment/config', { configKey: key, configValue: value })
        this.$message.success('已保存')
      } catch (e) { this.$message.error('保存失败') }
    },
    async loadCommunities() {
      this.tableLoading = true
      try {
        const r = await axios.get(API_BASE + '/payment/communities')
        this.communities = r.data.data || []
      } catch (e) { this.$message.error('加载社区列表失败') }
      finally { this.tableLoading = false }
    },
    startEdit(row) {
      this.editingId = row.id
      this.editForm = { subMchid: row.sub_mchid || '', commissionRate: Number(row.commission_rate) || 0 }
    },
    async saveCommunity(row) {
      try {
        await axios.put(API_BASE + '/payment/community', {
          communityId: row.id,
          subMchid: this.editForm.subMchid,
          commissionRate: this.editForm.commissionRate
        })
        this.$message.success('已保存')
        this.editingId = null
        await this.loadCommunities()
      } catch (e) { this.$message.error('保存失败') }
    }
  }
}

// ==================== Vue 路由 & 根实例 ====================
const router = new VueRouter({
  routes: [
    { path: '/', redirect: '/dashboard' },
    { path: '/dashboard', component: DashboardPage },
    { path: '/orders', component: OrdersPage },
    { path: '/escorts', component: EscortsPage },
    { path: '/community', component: CommunityPage },
    { path: '/payment', component: PaymentPage }
  ]
})

const TITLE_MAP = { '/dashboard':'运营总览', '/orders':'订单管理', '/escorts':'陪诊员管理', '/community':'社区与系统管理', '/payment':'支付管理' }

new Vue({
  el: '#app',
  router,
  data: {
    isLoggedIn: !!localStorage.getItem('admin_token'),
    loginForm: { username: 'admin', password: 'admin123' },
    loginLoading: false
  },
  computed: {
    pageTitle() { return TITLE_MAP[this.$route.path] || '管理后台' }
  },
  methods: {
    async handleLogin() {
      this.loginLoading = true
      try {
        const res = await axios.post('/api/v1/admin/login', this.loginForm)
        if (res.data.code === 0) {
          localStorage.setItem('admin_token', res.data.data.token)
          this.isLoggedIn = true
          this.$message.success('登录成功')
        } else {
          this.$message.error(res.data.message || '登录失败')
        }
      } catch (e) {
        this.$message.error('登录失败：' + (e.response?.data?.message || e.message))
      } finally {
        this.loginLoading = false
      }
    },
    handleLogout() {
      localStorage.removeItem('admin_token')
      this.isLoggedIn = false
      this.$message.success('已退出')
    }
  }
})
</script>
